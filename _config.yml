# -----------------------------------------------------------------------------
# Site settings
# -----------------------------------------------------------------------------

title: Emilia Gyr | Psicología & Bienestar # Título optimizado para buscadores
first_name: Emilia
middle_name: 
last_name: Gyr
contact_note: >
  gyr.emilia@gmail.com / +51 984165422 / +49 15755047718
description: > 
  Espacio de psicoterapia y acompañamiento psicológico online. Encuentra el equilibrio emocional y las herramientas para tu bienestar.
footer_text: >
  Todos los derechos reservados.
keywords: psicologa online, psicoterapia, salud mental, apoyo psicologico, bienestar emocional, emilia gyr
lang: es # Cambiado a español para que los textos automáticos del tema se traduzcan
favicon: favicon.png 

url: https://emiliagyr.github.io 
baseurl: 
last_updated: false 
impressum_path: /impressum/ # Recomendado si ejerces u ofreces servicios desde la UE (Alemania)
back_to_top: true 

# -----------------------------------------------------------------------------
# Theme
# -----------------------------------------------------------------------------

# Desactivados los trofeos de programador (no se necesitan para psicología)
repo_trophies:
  enabled: false

# -----------------------------------------------------------------------------
# Layout
# -----------------------------------------------------------------------------

navbar_fixed: true
footer_fixed: false # Falso para que el footer no tape contenido en pantallas pequeñas
search_enabled: false # Desactivado para un enfoque de servicios más limpio
socials_in_search: false
posts_in_search: false
bib_search: true

# Dimensions
max_width: 930px

# -----------------------------------------------------------------------------
# Open Graph & Schema.org (Para que cuando compartas tu web por WhatsApp se vea bonito)
# -----------------------------------------------------------------------------
serve_og_meta: true 
serve_schema_org: true 
og_image: assets/img/perfil.jpg # Sube una foto tuya a esa ruta para la vista previa de enlaces

# -----------------------------------------------------------------------------
# Blog (Tu espacio de divulgación sobre salud mental)
# -----------------------------------------------------------------------------

blog_name: Activities & events
blog_description: Psychology and neuroscience.
permalink: /blog/:year/:title/
lsi: false 

pagination:
  enabled: true

related_blog_posts:
  enabled: true
  max_related: 3

# Comentarios desactivados para mantener un tono profesional y evitar spam terapéutico
giscus:
  repo: 

# -----------------------------------------------------------------------------
# Newsletter
# -----------------------------------------------------------------------------

newsletter:
  enabled: false

# -----------------------------------------------------------------------------
# Collections (Desactivamos lo académico y dejamos activas las noticias/novedades)
# -----------------------------------------------------------------------------

collections:
  books:
    output: false
  news:
    defaults:
      layout: post
    output: true
  projects:
    output: false
  teachings:
    output: false

# -----------------------------------------------------------------------------
# Jekyll settings
# -----------------------------------------------------------------------------

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: "highlight"
    span:
      line_numbers: false
    block:
      line_numbers: false
      start_line: 1

include: ["_pages", "_scripts"]
exclude:
  - bin/
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - docker-compose.yml
  - docker-compose-slim.yml
  - FAQ.md
  - Gemfile
  - Gemfile.lock
  - INSTALL.md
  - LICENSE
  - lighthouse_results/
  - package.json
  - package-lock.json
  - _pages/about_einstein.md
  - purgecss.config.js
  - README.md
  - readme_preview/
  - vendor
keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-3rd-party-libraries
  - jekyll-archives-v2
  - jekyll-cache-bust
  - jekyll-email-protect
  - jekyll-feed
  - jekyll-get-json
  - jekyll-imagemagick
  - jekyll-jupyter-notebook
  - jekyll-link-attributes
  - jekyll-minifier
  - jekyll-paginate-v2
  - jekyll-regex-replace
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-socials
  - jekyll-tabs
  - jekyll-terser
  - jekyll-toc
  - jemoji

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed

# Scholar settings for bibliography
scholar:
  style: apa
  locale: en
  sort_by: year
  order: descending
  source: _bibliography
  bibliography: references.bib
  bibliography_template: bib

# -----------------------------------------------------------------------------
# Optional Features
# -----------------------------------------------------------------------------

enable_google_analytics: false 
enable_cookie_consent: true # Activado para cumplir con normativas europeas si te visitan desde allí
enable_masonry: false 
enable_math: false # Desactivado (no necesitas fórmulas matemáticas complejas)
enable_tooltips: false 
enable_darkmode: true # Permite a tus pacientes cambiar a modo claro u oscuro según su comodidad visual
enable_navbar_social: true # Muestra tus redes sociales (Instagram/LinkedIn si configuras) arriba
enable_project_categories: false 
enable_medium_zoom: true 
enable_progressbar: true 
enable_video_embedding: false

# Configuration of third party libraries
third_party_libraries:
  alerts:
    url:
      css: https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css
  bootstrap-table:
    url:
      css: https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/bootstrap-table.min.css
      js: https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/bootstrap-table.min.js
  code_folding:
    url:
      js: https://cdn.jsdelivr.net/gh/bramp/js-sequence-diagrams@2.0.1/dist/sequence-diagram-min.js
  diff2html:
    url:
      css: https://cdn.jsdelivr.net/npm/diff2html@3.4.47/bundles/css/diff2html.min.css
      js: https://cdn.jsdelivr.net/npm/diff2html@3.4.47/bundles/js/diff2html-ui.min.js
  images:
    url:
      js: https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js
  jquery:
    url:
      js: https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js
  mathjax:
    url:
      js: https://cdn.jsdelivr.net/npm/mathjax@3.2.0/es5/tex-mml-chtml.js
  masonry:
    url:
      js: https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js
  medium_zoom:
    url:
      js: https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js
  mermaid:
    url:
      js: https://cdn.jsdelivr.net/npm/mermaid@10.9.0/dist/mermaid.min.js
  slick:
    url:
      css: https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.css
      js: https://cdn.jsdelivr.net/npm/slick-carousel@1.8.1/slick/slick.min.js
  swiper:
    url:
      css: https://cdn.jsdelivr.net/npm/swiper@11.0.5/swiper-bundle.min.css
      js: https://cdn.jsdelivr.net/npm/swiper@11.0.5/swiper-bundle.min.js

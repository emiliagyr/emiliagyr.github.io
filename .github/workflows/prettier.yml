name: Prettier code formatter

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

# Forzamos a Node 24 globalmente en este flujo
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v5

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install dependencies 🔧
        run: npm ci

      - name: Run Prettier Formatter ✨
        # Cambiamos --check por --write para que si encuentra un error de espacios, 
        # el mismo bot lo corrija y lo guarde en vez de romper el despliegue.
        run: npx prettier --write .
